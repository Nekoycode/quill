[package]
name        = "zest"
version     = "0.1.0"
description = "A lightweight, customizable, thread-safe C++20 logging library"
license     = "MIT"
standard    = "c++20"

# zest is a header-only library. The lib target compiles src/zest.cppm, the
# C++20 module interface (`export module zest;`), which includes the umbrella
# header in its global module fragment and re-exports the public function API.
# Note: C++ modules cannot export macros — ZEST_INFO etc. remain available only
# via #include <zest/zest.h>.
# Compiler floor for the module: gcc >= 16 or clang >= 17 (gcc 15 and earlier
# cannot propagate placement new through a module BMI — GCC bug 101140 — which
# the deferred-formatting SBO relies on). mcpp's bundled toolchain is gcc 16.
[targets.zest]
kind = "lib"

[build]
include_dirs = ["include"]
